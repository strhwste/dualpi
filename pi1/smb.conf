# /etc/samba/smb.conf
# Timelapse Art Installation — Pi 1 Samba Shares
#
# Pi 2 mounts //192.168.50.1/timelapse using the timelapse-sync user.
# Dedicated low-privilege Samba user replaces insecure guest authentication.

[global]
   workgroup = TIMELAPSE
   server string = Timelapse Camera Pi
   security = user
   # Reject unknown users instead of mapping to guest
   map to guest = Never
   log file = /var/log/samba/log.%m
   max log size = 1000
   logging = file
   server role = standalone server
   # Enforce SMB3 minimum for security
   min protocol = SMB3_11
   # macOS compatibility — fruit VFS for Finder and Time Machine interop
   vfs objects = fruit streams_xattr
   fruit:metadata = netatalk
   fruit:model = MacSamba
   fruit:nfs_aces = no
   fruit:aapl = yes
   # Enable SMB signing for integrity
   server signing = mandatory
   # Disable unused features
   load printers = no
   printing = bsd
   printcap name = /dev/null

[timelapse]
   comment = Timelapse Images (read-only)
   path = /data/timelapse
   browseable = yes
   read only = yes
   valid users = timelapse-sync
   force user = pi
   create mask = 0644
   directory mask = 0755

[config]
   comment = Configuration (writable)
   path = /data
   browseable = yes
   read only = no
   valid users = timelapse-sync
   force user = pi
   create mask = 0644
   directory mask = 0755
